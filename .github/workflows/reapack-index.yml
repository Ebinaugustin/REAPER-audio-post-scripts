name: Publish ReaPack index
on:
  push:
    branches: [main]
    paths:
      - 'Extensions/**'
      - 'Screenshots/EA_Native_Automation/**'
      - '.reapack-index.conf'
      - '.github/workflows/reapack-index.yml'
      - '.reapack-release-assets/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reapack-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified release assets
        run: python3 .reapack-release-assets/materialize.py
      - name: Publish release assets and immutable version tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Extensions/EA_Native_Automation/v2.2.15
          git rm -r --ignore-unmatch .reapack-release-assets/v2.2.15/parts
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize verified EA Native Automation 2.2.15 release assets'
            git push origin HEAD:main
          fi
          if ! git rev-parse --verify refs/tags/ea-native-automation-v2.2.15 >/dev/null 2>&1; then
            git tag ea-native-automation-v2.2.15
            git push origin refs/tags/ea-native-automation-v2.2.15
          fi
      - name: Install official ReaPack indexer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc ruby ruby-dev ruby-rugged build-essential cmake pkg-config libssl-dev zlib1g-dev
          sudo gem install reapack-index --no-document --conservative
      - name: Validate extension metadata
        run: reapack-index --check --strict .
      - name: Generate index with immutable commit URLs
        run: reapack-index --scan Extensions --strict --no-commit .
      - name: Verify published platform sets and retained history
        run: python3 .reapack-release-assets/check_index.py
      - name: Publish index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Publish ReaPack package index'
            git push origin HEAD:main
          fi
